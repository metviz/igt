[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "igt"
version = "0.1.0"
description = "Instagram reel/post transcript CLI"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "yt-dlp>=2025.1.1",
    "faster-whisper>=1.0",
    "secretstorage>=3.5.0; sys_platform == 'linux'",
]

[project.scripts]
igt = "igt.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not integration'"
markers = ["integration: needs network, Instagram cookies and a Whisper model"]
